name: Post deadline countdown

on:
  workflow_dispatch:       # triggered by cron-job.org or manually from the GitHub UI

permissions:
  contents: read
  issues: write          # needed to open an issue when a run fails

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post to Bluesky
        run: python bot.py
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}

      # Reports a failure via a GitHub issue. If a bot-failure issue is already
      # open, this comments on it instead of opening a new one, so a run that
      # keeps failing produces one thread rather than an issue per day. GitHub
      # emails you on new issues and comments in your own repo, so this doubles
      # as the failure notification. Close the issue once fixed; the next
      # failure then opens a fresh one.
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const label = 'bot-failure';

            // Ensure the label exists, otherwise creating the issue with it fails.
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'd73a4a',
                description: 'Automated deadline bot run failure',
              });
            }

            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 1,
            });

            if (existing.data.length > 0) {
              const issue_number = existing.data[0].number;
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `Failed again on ${today} — [run log](${runUrl}).`,
              });
              core.notice(`Commented on existing issue #${issue_number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo,
                title: 'Deadline bot run is failing',
                body: [
                  `The daily Bluesky post failed on ${today}.`,
                  '',
                  `**Run log:** ${runUrl}`,
                  '',
                  'Common causes:',
                  '- `BSKY_APP_PASSWORD` revoked or expired (regenerate in Bluesky → Settings → App Passwords)',
                  '- A syntax error in `conferences.yaml` (run `python validate_conferences.py`)',
                  '- Bluesky/atproto API change or outage',
                  '',
                  'Subsequent failures will be added as comments here.',
                  'Re-run the workflow manually once fixed, then close this issue.',
                ].join('\n'),
                labels: [label],
              });
              core.notice(`Opened issue #${created.data.number}.`);
            }
