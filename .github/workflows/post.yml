name: Post deadline countdown

on:
  workflow_dispatch:       # triggered by cron-job.org or manually from the GitHub UI

permissions:
  contents: read
  issues: write          # needed to open an issue when a run fails

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post to Bluesky
        run: python bot.py
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}

      # Opens a GitHub issue if any step above failed. GitHub emails you on new
      # issues in your own repo, so this doubles as the failure notification.
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deadline bot run failed (${today})`,
              body: [
                'The daily Bluesky post failed.',
                '',
                `**Run log:** ${runUrl}`,
                '',
                'Common causes:',
                '- `BSKY_APP_PASSWORD` revoked or expired (regenerate in Bluesky → Settings → App Passwords)',
                '- A syntax error in `conferences.yaml`',
                '- Bluesky/atproto API change or outage',
                '',
                'No post went out today. Re-run the workflow manually once fixed.',
              ].join('\n'),
              labels: ['bot-failure'],
            });
